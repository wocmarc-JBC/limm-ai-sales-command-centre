name: Fix Duplicate Reply Performance Navigation

on:
  push:
    branches: [agent/fix-duplicate-reply-performance-nav]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-duplicate-reply-performance-nav
      - name: Remove duplicate navigation entry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/ShellChrome.tsx')
          text = path.read_text()
          line = '      { href: "/reply-performance", label: "Reply Performance", icon: "reports" }'
          duplicate = f'{line},\n{line}'
          if duplicate in text:
              path.write_text(text.replace(duplicate, line, 1))
          PY
      - name: Commit cleanup when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ShellChrome.tsx
          git commit -m "fix: remove duplicate Reply Performance navigation"
          git push
