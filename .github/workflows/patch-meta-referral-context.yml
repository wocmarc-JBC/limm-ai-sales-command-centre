name: Patch Meta Referral Context

on:
  push:
    branches: [agent/meta-referral-context]

permissions:
  contents: write

concurrency:
  group: patch-meta-referral-context
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[meta-referral-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/meta-referral-context
          fetch-depth: 0
      - name: Wire referral context through production path
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'insertion point not found: {path_name}: {old[:90]!r}')
              path.write_text(text.replace(old, new, 1))

          # Parser: whitelist and normalize the Meta referral object.
          replace_once(
              'lib/whatsapp-parser.ts',
              'export type ParsedWhatsAppMessage = {',
              'import { parseWhatsAppReferralContext, type WhatsAppReferralContext } from "@/lib/whatsapp-referral-context";\n\nexport type ParsedWhatsAppMessage = {'
          )
          replace_once(
              'lib/whatsapp-parser.ts',
              '  businessPhoneNumberId: string;\n};',
              '  businessPhoneNumberId: string;\n  referral: WhatsAppReferralContext | null;\n};'
          )
          replace_once(
              'lib/whatsapp-parser.ts',
              '          contactName: String(contact?.profile?.name ?? ""),\n          businessPhoneNumberId: String(value?.metadata?.phone_number_id ?? "")',
              '          contactName: String(contact?.profile?.name ?? ""),\n          businessPhoneNumberId: String(value?.metadata?.phone_number_id ?? ""),\n          referral: parseWhatsAppReferralContext(message?.referral)'
          )

          # Leads repository: persist confirmed referral memory without adding a table.
          replace_once(
              'lib/data/leads-repository.ts',
              'import type { Division, Lead, LeadCategory, LeadFile, LeadIntakeProfile, LeadMessage, LeadStatus } from "@/lib/types";',
              'import type { Division, Lead, LeadCategory, LeadFile, LeadIntakeProfile, LeadMessage, LeadStatus } from "@/lib/types";\nimport { referralContextForStorage, type WhatsAppReferralContext } from "@/lib/whatsapp-referral-context";'
          )
          replace_once(
              'lib/data/leads-repository.ts',
              '\nfunction intentGateIntakeProfile(\n',
              '''\nexport async function persistWhatsAppReferralContext(\n  lead: Lead,\n  context: WhatsAppReferralContext,\n  metadata: Record<string, unknown> = {}\n) {\n  const latest = await getLeadById(lead.id) ?? lead;\n  const stored = referralContextForStorage(context);\n  if (!stored) return latest;\n  const currentTrace = (latest.intakeProfile?.trace ?? {}) as Record<string, unknown>;\n  const existing = currentTrace.whatsappReferralContext as Record<string, unknown> | undefined;\n  if (existing?.confirmed === true && existing.ctwaClid === stored.ctwaClid && existing.sourceId === stored.sourceId) {\n    return latest;\n  }\n  const intakeProfile: LeadIntakeProfile = {\n    ...(latest.intakeProfile ?? {}),\n    trace: {\n      ...currentTrace,\n      whatsappReferralContext: stored\n    }\n  };\n  const leadSource = latest.leadSource && !["WhatsApp", "Meta Click-to-WhatsApp"].includes(latest.leadSource)\n    ? latest.leadSource\n    : "Meta Click-to-WhatsApp";\n  return updateLead(\n    latest.id,\n    { intakeProfile, leadSource },\n    "whatsapp_meta_referral_context_captured",\n    "Confirmed Meta Click-to-WhatsApp referral context stored for reply planning.",\n    {\n      auditActorType: "system",\n      auditActorName: "WhatsApp Referral Context",\n      referralConfirmed: true,\n      referralServiceKey: stored.serviceKey,\n      referralServiceLabel: stored.serviceLabel,\n      referralSourceType: stored.sourceType,\n      sourceIdPresent: Boolean(stored.sourceId),\n      sourceUrlPresent: Boolean(stored.sourceUrl),\n      ctwaClidPresent: Boolean(stored.ctwaClid),\n      rawIdentifiersClientFacing: false,\n      noWhatsAppSend: true,\n      ...metadata\n    }\n  );\n}\n\nfunction intentGateIntakeProfile(\n'''
          )

          # Inbound handler: preserve exact sanitized evidence and durable lead memory.
          replace_once(
              'lib/whatsapp-auto-reply.ts',
              '  recordConversationSafetyOutcome,\n  updateConversationRouting,',
              '  persistWhatsAppReferralContext,\n  recordConversationSafetyOutcome,\n  updateConversationRouting,'
          )
          replace_once(
              'lib/whatsapp-auto-reply.ts',
              'import type { ParsedWhatsAppMessage } from "@/lib/whatsapp-parser";',
              'import type { ParsedWhatsAppMessage } from "@/lib/whatsapp-parser";\nimport { referralContextForStorage } from "@/lib/whatsapp-referral-context";'
          )
          replace_once(
              'lib/whatsapp-auto-reply.ts',
              '        businessPhoneNumberId: message.businessPhoneNumberId,\n        providerMessageId,',
              '        businessPhoneNumberId: message.businessPhoneNumberId,\n        whatsappReferral: referralContextForStorage(message.referral),\n        referralContextConfirmed: Boolean(message.referral),\n        providerMessageId,'
          )
          replace_once(
              'lib/whatsapp-auto-reply.ts',
              '    logWhatsApp("whatsapp_inbound_message_saved", { providerMessageId, leadId: lead.id });\n  } catch (error) {',
              '''    logWhatsApp("whatsapp_inbound_message_saved", { providerMessageId, leadId: lead.id });\n    if (message.referral) {\n      try {\n        const referralLead = await persistWhatsAppReferralContext(lead, message.referral, { providerMessageId });\n        if (referralLead) lead = referralLead;\n        logWhatsApp("whatsapp_meta_referral_context_captured", {\n          providerMessageId,\n          leadId: lead.id,\n          serviceKey: message.referral.serviceKey,\n          sourceType: message.referral.sourceType,\n          ctwaClidPresent: Boolean(message.referral.ctwaClid)\n        });\n      } catch (referralError) {\n        logWhatsAppError("meta_referral_context_persist", {\n          providerMessageId,\n          leadId: lead.id,\n          reason: safeError(referralError)\n        });\n        await auditWhatsApp({\n          action: "whatsapp_meta_referral_context_persist_failed",\n          leadId: lead.id,\n          summary: "Referral evidence remains on the inbound message, but durable lead referral memory could not be updated.",\n          metadata: {\n            providerMessageId,\n            referralContextConfirmed: true,\n            rawIdentifiersClientFacing: false,\n            noWhatsAppSend: true,\n            reason: safeError(referralError)\n          }\n        }).catch(() => false);\n      }\n    }\n  } catch (error) {'''
          )
          replace_once(
              'lib/whatsapp-auto-reply.ts',
              '      rawInboundSavedBeforeIntentClassification: true,\n      intentGateVersion: "v10.2.0"',
              '      rawInboundSavedBeforeIntentClassification: true,\n      referralContextConfirmed: Boolean(message.referral),\n      referralServiceKey: message.referral?.serviceKey ?? "",\n      referralSourceType: message.referral?.sourceType ?? "",\n      ctwaClidPresent: Boolean(message.referral?.ctwaClid),\n      rawReferralIdentifiersClientFacing: false,\n      intentGateVersion: "v10.2.0"'
          )

          # Sales brain: use confirmed ad context for vague first-touch messages only.
          replace_once(
              'lib/whatsapp-v9-sales-brain.ts',
              'import { validateWhatsAppAutoReply } from "@/lib/whatsapp-safety";',
              'import { validateWhatsAppAutoReply } from "@/lib/whatsapp-safety";\nimport { composeReferralAwareFirstTouchReply, getWhatsAppReferralContext, referralTrace } from "@/lib/whatsapp-referral-context";'
          )
          replace_once(
              'lib/whatsapp-v9-sales-brain.ts',
              '  if (isShortCarpentryPriceEnquiry(input.inboundMessageText)) return composeCarpentryDemoPriceReply(memory, input);\n  const text = normalize(input.inboundMessageText);',
              '  if (isShortCarpentryPriceEnquiry(input.inboundMessageText)) return composeCarpentryDemoPriceReply(memory, input);\n  const referralContext = getWhatsAppReferralContext(input.lead, input.previousMessages);\n  const referralReply = referralContext ? composeReferralAwareFirstTouchReply(referralContext, input.inboundMessageText) : "";\n  if (referralReply) return referralReply;\n  const text = normalize(input.inboundMessageText);'
          )
          replace_once(
              'lib/whatsapp-v9-sales-brain.ts',
              '  const correctionApplied = memory.correction_history.length > 0 || memory.handoff_lock;\n  const blockedLegacyTemplate = legacyTemplateBlocked(final.reply);\n  const trace = {',
              '  const correctionApplied = memory.correction_history.length > 0 || memory.handoff_lock;\n  const blockedLegacyTemplate = legacyTemplateBlocked(final.reply);\n  const referralContext = getWhatsAppReferralContext(input.lead, input.previousMessages);\n  const trace = {\n    ...referralTrace(referralContext),'
          )

          # Release gate.
          replace_once(
              '.github/workflows/release-gate.yml',
              '      - name: Verify v11.4.8 reply performance dashboard\n        run: node scripts/test_v11_4_8_reply_performance_dashboard.mjs\n      - run: npm run verify',
              '      - name: Verify v11.4.8 reply performance dashboard\n        run: node scripts/test_v11_4_8_reply_performance_dashboard.mjs\n      - name: Verify v11.4.9 Meta referral context\n        run: node scripts/test_v11_4_9_meta_referral_context.mjs\n      - run: npm run verify'
          )
          PY
      - name: Commit production wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/whatsapp-parser.ts lib/data/leads-repository.ts lib/whatsapp-auto-reply.ts lib/whatsapp-v9-sales-brain.ts .github/workflows/release-gate.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: wire confirmed Meta referral context into sales replies [meta-referral-patched]"
          git push
