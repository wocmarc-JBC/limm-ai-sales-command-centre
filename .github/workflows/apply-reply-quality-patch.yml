name: Apply Reply Quality Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'agent/reply-quality-gate' && !contains(github.event.pull_request.head.sha, 'reply-quality-patched') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reply-quality-gate
          fetch-depth: 0
      - name: Patch production composer
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/whatsapp-reply-decision.ts')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              '} from "@/lib/whatsapp-v9-sales-brain";\n',
              '} from "@/lib/whatsapp-v9-sales-brain";\nimport { improveWhatsAppReplyQuality } from "@/lib/whatsapp-reply-quality-gate";\n',
              1
          ) if 'whatsapp-reply-quality-gate' not in source else source

          if 'const replyQuality = improveWhatsAppReplyQuality' not in source:
              source = source.replace(
                  '  const candidateReply = v9.replyText;\n',
                  '''  const replyQuality = improveWhatsAppReplyQuality({
            candidateReply: v9.replyText,
            inboundMessageText: input.inboundMessageText,
            intent: v9.intent,
            lead: input.lead,
            previousMessages: input.previousMessages
          });
          const candidateReply = replyQuality.replyText;
          ''',
                  1
              )

          replacements = {
              '    answeredClientQuestion: v9.answeredClientQuestion,\n': '    answeredClientQuestion: replyQuality.answeredDirectQuestion || v9.answeredClientQuestion,\n',
              '    askedNextBestQuestion: v9.askedNextBestQuestion,\n': '    askedNextBestQuestion: replyQuality.askedNextBestQuestion,\n',
              '    handoffRequired: v9.handoffRequired,\n': '    handoffRequired: v9.handoffRequired || replyQuality.handoffRequired,\n',
              '    qualityResult: v9.qualityResult,\n': '    qualityResult: replyQuality.rewritten ? "rewritten" : v9.qualityResult,\n',
              '      plannerInboundText,\n': '      plannerInboundText,\n      replyQualityGate: replyQuality,\n'
          }
          for old, new in replacements.items():
              if new not in source:
                  assert old in source, old
                  source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/whatsapp-reply-decision.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: enforce final reply quality gate [reply-quality-patched]"
          git push origin HEAD:agent/reply-quality-gate
