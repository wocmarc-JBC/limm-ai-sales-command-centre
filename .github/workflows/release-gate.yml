name: Release Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-sales-inbox-heading-test:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/non-sales-inbox-routing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/non-sales-inbox-routing
          fetch-depth: 0
      - name: Update stale browser assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/v11-world-class.spec.ts')
          text = path.read_text()
          old = 'await expect(page.getByRole("heading", { name: "WhatsApp Inbox" })).toBeVisible();'
          new = 'await expect(page.getByRole("heading", { name: /WhatsApp (?:Sales )?Inbox/ })).toBeVisible();'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected inbox heading assertion was not found.')
          PY
      - name: Commit patched browser expectation when changed
        shell: bash
        run: |
          if git diff --quiet -- tests/e2e/v11-world-class.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/v11-world-class.spec.ts
          git commit -m "test: align browser QA with the sales-first inbox heading"
          git push origin HEAD:agent/non-sales-inbox-routing

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_DATA_MODE: mock
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Verify through v11.2 durable release
        shell: bash
        run: |
          mkdir -p test-results/release-gate
          set -o pipefail
          npm run test:v11.2.0 2>&1 | tee test-results/release-gate/v11-2.log
      - name: Upload legacy gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-v11-2-diagnostics
          path: test-results/release-gate/v11-2.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify v11.3 reliability and disaster recovery
        run: node scripts/test_v11_3_reliability_disaster_recovery.mjs
      - name: Verify v11.4 recovery readiness
        run: node scripts/test_v11_4_recovery_readiness.mjs
      - name: Verify v11.4.1 conversation intelligence
        run: node scripts/test_v11_4_1_conversation_intelligence.mjs
      - name: Verify v11.4.2 resumable client-file backup
        run: node scripts/test_v11_4_2_resumable_client_file_backup.mjs
      - name: Verify v11.4.3 human handoff reliability
        run: node scripts/test_v11_4_3_human_handoff_reliability.mjs
      - name: Verify v11.4.4 reply quality gate
        run: node scripts/test_v11_4_4_reply_quality_gate.mjs
      - name: Verify v11.4.5 conversation data hygiene and boss triage
        run: node scripts/test_v11_4_5_conversation_data_hygiene_triage.mjs
      - name: Verify v11.4.6 boss triage UI
        run: node scripts/test_v11_4_6_boss_triage_ui.mjs
      - name: Verify v11.4.7 reply outcome learning
        run: node scripts/test_v11_4_7_reply_outcome_learning.mjs
      - name: Verify v11.4.8 reply performance dashboard
        run: node scripts/test_v11_4_8_reply_performance_dashboard.mjs
      - name: Verify v11.4.9 Meta referral context
        run: node scripts/test_v11_4_9_meta_referral_context.mjs
      - name: Verify v11.4.10 trade knowledge
        run: node scripts/test_v11_4_10_trade_knowledge.mjs
      - name: Verify v11.4.11 tiered handoff
        run: node scripts/test_v11_4_11_tiered_handoff.mjs
      - name: Verify v11.4.12 reply strategy recommendations
        run: node scripts/test_v11_4_12_reply_strategy_recommendations.mjs
      - name: Verify v11.4.13 non-sales inbox routing
        run: node scripts/test_v11_4_13_non_sales_inbox_routing.mjs
      - run: npm run verify
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:browser
      - name: Upload browser QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-diagnostics
          path: |
            test-results/v4_2_qa_summary/**
            test-results/playwright/**
            playwright-report/**
            V4_2_FULL_BROWSER_HUMAN_QA_REPORT.md
          if-no-files-found: warn
          retention-days: 7
      - name: Upload inbox visual baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inbox-visual-baseline
          path: screenshots/**/inbox-visual-baseline/*.png
          if-no-files-found: warn
          retention-days: 14
